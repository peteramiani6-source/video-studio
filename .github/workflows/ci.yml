name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python compiles
        run: python -m py_compile scripts/*.py
      - name: Shell syntax
        run: for f in scripts/*.sh setup.sh tests/*.sh; do bash -n "$f"; done
      - name: ShellCheck (errors only)
        run: shellcheck -S error scripts/*.sh setup.sh tests/*.sh
      - name: Config is valid JSON
        run: python -c "import json; [json.load(open(f)) for f in ('config/brand.json', 'config/event.example.json')]"
      - name: Unit tests (JSON parsing, plan validation, times, pause cuts)
        run: python -m unittest discover -s tests -v

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fontconfig
      - name: Render test (clip mode + event mode, no models)
        run: tests/smoke.sh
      - name: Upload renders on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: |
            out/ci-smoke/
            logs/pipeline.log
          if-no-files-found: ignore

  animation:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Remotion (pinned)
        run: npm ci --no-audit --no-fund
        working-directory: remotion
      - name: Type-check the templates
        run: npx tsc --noEmit
        working-directory: remotion
      - name: Scripture episodes are valid (verse text matches the KJV)
        run: python scripts/scripture.py check
      - name: Render a draft scripture episode (with a skit)
        run: |
          python scripts/scripture.py render ep004 --draft
          python - <<'PY'
          import json, subprocess, sys
          out = "out/scripture/ep004/ep004_vertical_draft.mp4"
          info = json.loads(subprocess.run(["ffprobe", "-v", "error", "-print_format", "json", "-show_format",
                                            "-show_streams", out], capture_output=True, text=True, check=True).stdout)
          v = next(s for s in info["streams"] if s["codec_type"] == "video")
          d = float(info["format"]["duration"])
          print(f"{out}: {d:.1f}s {v['width']}x{v['height']}")
          if (v["width"], v["height"]) != (540, 960) or not 20 < d < 70:
              sys.exit("unexpected size or length")
          PY
      - name: Upload the render on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scripture-render
          path: |
            out/scripture/
            logs/pipeline.log
          if-no-files-found: ignore
