name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python compiles
        run: python -m py_compile scripts/*.py
      - name: Shell syntax
        run: for f in scripts/*.sh setup.sh tests/*.sh; do bash -n "$f"; done
      - name: ShellCheck (errors only)
        run: shellcheck -S error scripts/*.sh setup.sh tests/*.sh
      - name: Config is valid JSON
        run: python -c "import json; [json.load(open(f)) for f in ('config/brand.json', 'event.example.json')]"

  smoke:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fontconfig
      - name: Render test (clip mode + event mode, no models)
        run: tests/smoke.sh
      - name: Upload renders on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: |
            out/ci-smoke/
            logs/pipeline.log
          if-no-files-found: ignore
